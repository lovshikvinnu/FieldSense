<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" width="1240" height="800" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arRed" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#ef4444"/>
    </marker>
    <marker id="arGrn" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#10b981"/>
    </marker>
    <marker id="arYel" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arBlu" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect width="1240" height="800" rx="10" fill="#0f172a"/>
  <text x="30" y="42" fill="#10b981" font-size="24" font-weight="800" letter-spacing="0.6">FieldSense AI — V1 Hardware Wiring</text>
  <text x="30" y="64" fill="#94a3b8" font-size="13">Arduino UNO Q · JXBS-3001-TR · NEO-M8N · 2.8" ST7789V — two galvanically isolated power domains</text>

  <!-- ============ POWER BANK ============ -->
  <rect x="30" y="96" width="215" height="96" rx="9" fill="#1e293b" stroke="#ef4444" stroke-width="1.6"/>
  <text x="46" y="122" fill="#f8fafc" font-size="14" font-weight="700">POWER BANK — 5 V</text>
  <text x="46" y="144" fill="#94a3b8" font-size="12">USB-C out → UNO Q</text>
  <text x="46" y="163" fill="#94a3b8" font-size="12">Powers the board only</text>
  <text x="46" y="182" fill="#ef4444" font-size="11" font-weight="700">DOMAIN A · 5 V</text>

  <!-- ============ UNO Q ============ -->
  <rect x="330" y="96" width="330" height="290" rx="9" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="350" y="124" fill="#f8fafc" font-size="16" font-weight="800">ARDUINO UNO Q</text>
  <text x="350" y="145" fill="#94a3b8" font-size="11.5">Qualcomm QRB2210 (Debian Linux MPU)</text>
  <text x="350" y="163" fill="#94a3b8" font-size="11.5">STM32U585 (Arduino MCU)</text>
  <line x1="350" y1="176" x2="640" y2="176" stroke="#334155" stroke-width="1"/>
  <text x="350" y="198" fill="#3b82f6" font-size="12" font-weight="700">Serial1 — hardware UART</text>
  <text x="360" y="217" fill="#cbd5e1" font-size="11.5">Pin 0  RX  ← GPS TX</text>
  <text x="360" y="234" fill="#cbd5e1" font-size="11.5">Pin 1  TX  → GPS RX</text>
  <text x="350" y="260" fill="#3b82f6" font-size="12" font-weight="700">SPI — display</text>
  <text x="360" y="279" fill="#cbd5e1" font-size="11.5">D13 SCK · D11 MOSI · D12 MISO</text>
  <text x="360" y="296" fill="#cbd5e1" font-size="11.5">D10 CS · D9 DC · D8 RESET</text>
  <text x="350" y="322" fill="#3b82f6" font-size="12" font-weight="700">USB host</text>
  <text x="360" y="341" fill="#cbd5e1" font-size="11.5">USB-RS485 adapter → /dev/ttyUSB0</text>
  <text x="350" y="367" fill="#ef4444" font-size="11" font-weight="700">DOMAIN A · 5 V / 3.3 V logic</text>

  <line x1="245" y1="144" x2="325" y2="144" stroke="#ef4444" stroke-width="2.4" marker-end="url(#arRed)"/>
  <text x="248" y="136" fill="#ef4444" font-size="10.5" font-weight="600">USB-C 5 V</text>

  <!-- ============ NEO-M8N ============ -->
  <rect x="740" y="96" width="470" height="130" rx="9" fill="#1e293b" stroke="#10b981" stroke-width="1.6"/>
  <text x="758" y="122" fill="#f8fafc" font-size="14" font-weight="700">NEO-M8N GPS  (GY-GPSV3-NEO)</text>
  <text x="758" y="145" fill="#cbd5e1" font-size="11.5">VCC → 5 V or 3.3 V   ·   GND → GND</text>
  <text x="758" y="164" fill="#10b981" font-size="11.5" font-weight="600">TX  → UNO Q  RX  (Pin 0 / Serial1)</text>
  <text x="758" y="183" fill="#10b981" font-size="11.5" font-weight="600">RX  ← UNO Q  TX  (Pin 1 / Serial1)</text>
  <text x="758" y="207" fill="#94a3b8" font-size="11">NMEA 0183 · 9600 8-N-1 · ~1 Hz · TX/RX cross over</text>

  <line x1="660" y1="205" x2="735" y2="160" stroke="#10b981" stroke-width="2.4" marker-end="url(#arGrn)"/>
  <text x="655" y="196" fill="#10b981" font-size="10.5" font-weight="600">UART</text>

  <!-- ============ USB-RS485 ============ -->
  <rect x="740" y="248" width="470" height="112" rx="9" fill="#1e293b" stroke="#64748b" stroke-width="1.6"/>
  <text x="758" y="274" fill="#f8fafc" font-size="14" font-weight="700">USB → RS485 ADAPTER</text>
  <text x="758" y="296" fill="#cbd5e1" font-size="11.5">USB  ← UNO Q USB host port</text>
  <text x="758" y="315" fill="#f59e0b" font-size="11.5" font-weight="600">A (D+) → JXBS yellow</text>
  <text x="758" y="334" fill="#3b82f6" font-size="11.5" font-weight="600">B (D−) → JXBS blue / green</text>
  <text x="758" y="353" fill="#94a3b8" font-size="11">Enumerates as /dev/ttyUSB0</text>

  <line x1="660" y1="335" x2="735" y2="300" stroke="#64748b" stroke-width="2.4" marker-end="url(#ar)"/>
  <text x="652" y="326" fill="#94a3b8" font-size="10.5" font-weight="600">USB</text>

  <!-- ============ JXBS + battery ============ -->
  <rect x="740" y="382" width="470" height="200" rx="9" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="758" y="408" fill="#f8fafc" font-size="14" font-weight="700">JXBS-3001-TR  7-in-1 SOIL PROBE</text>
  <text x="758" y="430" fill="#94a3b8" font-size="11.5">Modbus RTU / RS485 · 9600 8-N-1 · slave 0x01</text>
  <line x1="758" y1="442" x2="1190" y2="442" stroke="#334155" stroke-width="1"/>
  <text x="758" y="464" fill="#ef4444" font-size="11.5" font-weight="600">BROWN  VCC  ← +12 V   (18650 pack)</text>
  <text x="758" y="483" fill="#cbd5e1" font-size="11.5">BLACK   GND  ← pack −  (common ground)</text>
  <text x="758" y="502" fill="#f59e0b" font-size="11.5" font-weight="600">YELLOW  A (D+) → adapter A</text>
  <text x="758" y="521" fill="#3b82f6" font-size="11.5" font-weight="600">BLUE    B (D−) → adapter B</text>
  <text x="758" y="545" fill="#94a3b8" font-size="11">Measures N · P · K · pH · EC · moisture · temperature</text>
  <text x="758" y="566" fill="#f59e0b" font-size="11" font-weight="700">DOMAIN B · 12 V</text>

  <line x1="975" y1="360" x2="975" y2="378" stroke="#f59e0b" stroke-width="2.4" marker-end="url(#arYel)"/>

  <!-- ============ 18650 pack ============ -->
  <rect x="330" y="470" width="330" height="112" rx="9" fill="#1e293b" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="350" y="496" fill="#f8fafc" font-size="14" font-weight="700">3S 18650 PACK — 12 V</text>
  <text x="350" y="518" fill="#94a3b8" font-size="11.5">3 × Li-ion + 3S BMS · ~11.1 V nominal</text>
  <text x="350" y="537" fill="#f59e0b" font-size="11.5" font-weight="600">+12 V → JXBS brown</text>
  <text x="350" y="556" fill="#cbd5e1" font-size="11.5">GND  → JXBS black</text>
  <text x="350" y="575" fill="#f59e0b" font-size="11" font-weight="700">DOMAIN B · 12 V — sensor only</text>

  <line x1="660" y1="500" x2="735" y2="470" stroke="#f59e0b" stroke-width="2.4" marker-end="url(#arYel)"/>
  <text x="650" y="492" fill="#f59e0b" font-size="10.5" font-weight="600">12 V</text>

  <!-- ============ TFT ============ -->
  <rect x="30" y="216" width="270" height="366" rx="9" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="48" y="242" fill="#f8fafc" font-size="14" font-weight="700">2.8" SPI TFT — ST7789V</text>
  <text x="48" y="262" fill="#94a3b8" font-size="11.5">240 × 320 · XPT2046 touch</text>
  <line x1="48" y1="274" x2="282" y2="274" stroke="#334155" stroke-width="1"/>
  <text x="48" y="296" fill="#cbd5e1" font-size="12">VCC</text>       <text x="176" y="296" fill="#ef4444" font-size="12" font-weight="600">3.3 V</text>
  <text x="48" y="317" fill="#cbd5e1" font-size="12">GND</text>       <text x="176" y="317" fill="#94a3b8" font-size="12" font-weight="600">GND</text>
  <text x="48" y="338" fill="#cbd5e1" font-size="12">CS</text>        <text x="176" y="338" fill="#3b82f6" font-size="12" font-weight="600">D10</text>
  <text x="48" y="359" fill="#cbd5e1" font-size="12">RESET</text>     <text x="176" y="359" fill="#3b82f6" font-size="12" font-weight="600">D8</text>
  <text x="48" y="380" fill="#cbd5e1" font-size="12">DC / RS</text>   <text x="176" y="380" fill="#3b82f6" font-size="12" font-weight="600">D9</text>
  <text x="48" y="401" fill="#cbd5e1" font-size="12">SDI / MOSI</text><text x="176" y="401" fill="#3b82f6" font-size="12" font-weight="600">D11</text>
  <text x="48" y="422" fill="#cbd5e1" font-size="12">SCK</text>       <text x="176" y="422" fill="#3b82f6" font-size="12" font-weight="600">D13</text>
  <text x="48" y="443" fill="#cbd5e1" font-size="12">LED / BLK</text> <text x="176" y="443" fill="#ef4444" font-size="12" font-weight="600">3.3 V</text>
  <text x="48" y="464" fill="#cbd5e1" font-size="12">SDO / MISO</text><text x="176" y="464" fill="#3b82f6" font-size="12" font-weight="600">D12</text>
  <line x1="48" y1="480" x2="282" y2="480" stroke="#334155" stroke-width="1"/>
  <text x="48" y="502" fill="#f59e0b" font-size="11" font-weight="700">3.3 V LOGIC ONLY</text>
  <text x="48" y="520" fill="#94a3b8" font-size="10.5">Power pin tolerates 5 V via the onboard</text>
  <text x="48" y="535" fill="#94a3b8" font-size="10.5">LDO; signal lines do NOT. No level</text>
  <text x="48" y="550" fill="#94a3b8" font-size="10.5">shifters are fitted on this board.</text>
  <text x="48" y="571" fill="#94a3b8" font-size="10.5">Give touch its own SPI — see HARDWARE.md</text>

  <line x1="325" y1="330" x2="305" y2="330" stroke="#3b82f6" stroke-width="2.4" marker-end="url(#arBlu)"/>
  <text x="292" y="322" fill="#3b82f6" font-size="10.5" font-weight="600" text-anchor="end">SPI</text>

  <!-- ============ isolation warning ============ -->
  <rect x="30" y="606" width="630" height="76" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.6"/>
  <text x="48" y="630" fill="#ef4444" font-size="13" font-weight="800">⚠  KEEP THE TWO POWER DOMAINS ISOLATED</text>
  <text x="48" y="651" fill="#cbd5e1" font-size="11.5">The 12 V rail feeds the JXBS probe ONLY. Never connect +12 V to any UNO Q pin.</text>
  <text x="48" y="670" fill="#cbd5e1" font-size="11.5">Grounds are tied together so RS485 has a shared reference — that link is required.</text>

  <!-- ============ legend ============ -->
  <rect x="690" y="606" width="520" height="76" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="708" y="628" fill="#94a3b8" font-size="11.5" font-weight="700" letter-spacing="0.5">LEGEND</text>
  <line x1="708" y1="646" x2="736" y2="646" stroke="#ef4444" stroke-width="3"/><text x="744" y="650" fill="#cbd5e1" font-size="11">Power</text>
  <line x1="800" y1="646" x2="828" y2="646" stroke="#10b981" stroke-width="3"/><text x="836" y="650" fill="#cbd5e1" font-size="11">UART</text>
  <line x1="890" y1="646" x2="918" y2="646" stroke="#f59e0b" stroke-width="3"/><text x="926" y="650" fill="#cbd5e1" font-size="11">RS485 A / 12 V</text>
  <line x1="1050" y1="646" x2="1078" y2="646" stroke="#3b82f6" stroke-width="3"/><text x="1086" y="650" fill="#cbd5e1" font-size="11">SPI / RS485 B</text>
  <line x1="708" y1="668" x2="736" y2="668" stroke="#64748b" stroke-width="3"/><text x="744" y="672" fill="#cbd5e1" font-size="11">USB</text>
  <text x="800" y="672" fill="#64748b" font-size="10.5">Pin assignments: DSP-01 / HW-03 pending — see docs/STATUS.md</text>

  <text x="30" y="712" fill="#64748b" font-size="10.5">Verified: JXBS → MAX485/USB-RS485 → UNO Q acquisition chain. Pending: GPS UART node (HW-03), display SPI pins (DSP-01).</text>
  <text x="30" y="730" fill="#64748b" font-size="10.5">Full electrical detail, register maps and datasheet references: docs/HARDWARE.md</text>
</svg>
