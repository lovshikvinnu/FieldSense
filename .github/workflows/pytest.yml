name: tests

# The suite is the only thing standing between a refactor and a field unit, so
# it runs on every push to main and every pull request. There is nothing to
# install beyond pytest itself: the package declares `dependencies = []` and the
# runtime is standard library only.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the project claims (`requires-python = ">=3.10"`) and a
        # current release. If the floor ever breaks, that is a packaging bug
        # worth failing on rather than discovering on a board.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      # -rs lists what was skipped and why. Two display-bridge tests need a
      # Chromium-family browser and skip without one; that is expected on a
      # runner and must stay visible rather than quietly reducing coverage.
      - name: Run the suite
        run: python -m pytest -q -rs

  documented-count:
    name: documented test count is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      # The number in the README badge has drifted four times: 294, 529, 552,
      # 565. Nothing checked it, so it was only ever corrected when a human
      # happened to notice. This compares it against the suite.
      #
      # It keys off the COLLECTED count, not the passed count. Collection is
      # deterministic everywhere; "passed" is not, because the browser-gated
      # tests skip on a runner and would make the target number depend on what
      # happened to be installed.
      - name: Compare the documented count against the suite
        run: python .github/scripts/check_documented_test_count.py
