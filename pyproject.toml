[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldsense"
version = "0.1.0"
description = "FieldSense AI - Offline portable edge-intelligence platform for soil assessment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

# Without this, setuptools falls back to flat-layout auto-discovery, sees
# `fieldsense`, `deploy`, `artifacts`, `firmware` and `hardware` as five
# candidate top-level packages, and refuses to build at all:
#
#   error: Multiple top-level packages discovered in a flat-layout
#
# Only `fieldsense` is importable code. The rest are firmware, bench records,
# systemd units and generated output that happen to live beside it.
[tool.setuptools.packages.find]
include = ["fieldsense*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
